server {
    listen 80;
    listen [::]:80;

    # Troque pelo seu dominio ou IP do servidor.
    server_name anjos-do-peito.com.br www.anjos-do-peito.com.br;

    # Projeto Laravel: o Nginx deve apontar para /public, nao para a raiz.
    root /var/www/anjos-do-peito/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 32M;

    access_log /var/log/nginx/anjos-do-peito.access.log;
    error_log /var/log/nginx/anjos-do-peito.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Assets compilados pelo Vite em producao.
    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bloqueia arquivos sensiveis/dotfiles, inclusive .env.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (^|/)(\.env|\.env\..*|composer\.(json|lock)|package(-lock)?\.json|vite\.config\.js|artisan|phpunit\.xml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

}
